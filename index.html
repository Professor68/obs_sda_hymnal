<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Hymnal Controller</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* OBS Yami Theme Colors */
      --obs-bg: #1c1f24;
      --obs-card: #2b2e38;
      --obs-border: #121418;
      --obs-border-light: #424755;
      --obs-primary: #2e85e4;
      --obs-primary-hover: #1e75d4;
      --obs-danger: #e42e2e;
      --obs-danger-hover: #c42222;
      --obs-btn-bg: #3e4451;
      --obs-btn-hover: #4d5565;
      --obs-text: #cccccc;
      --obs-text-light: #ffffff;
      --obs-input-bg: #121418;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Lato', sans-serif;
      background-color: var(--obs-bg);
      color: var(--obs-text);
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--obs-bg); }
    ::-webkit-scrollbar-thumb { background: var(--obs-btn-bg); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--obs-border-light); }

    .controller-container { display: flex; flex-direction: column; height: 100vh; padding: 15px; box-sizing: border-box; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--obs-border-light); }
    .search-input { width: 100%; padding: 10px; background-color: var(--obs-input-bg); border: 1px solid var(--obs-border-light); color: var(--obs-text-light); border-radius: 4px; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
    .search-input:focus { outline: none; border-color: var(--obs-primary); }
    .song-list { flex: 1; overflow-y: auto; background-color: var(--obs-card); border-radius: 4px; border: 1px solid var(--obs-border); padding: 5px; }

    .btn { background-color: var(--obs-btn-bg); color: var(--obs-text-light); border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
    .btn:hover { background-color: var(--obs-btn-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background-color: var(--obs-primary); }
    .btn-primary:hover { background-color: var(--obs-primary-hover); }
    .btn-danger { background-color: var(--obs-danger); }
    .btn-danger:hover { background-color: var(--obs-danger-hover); }

    .tab-bar { display: flex; margin-bottom: 10px; gap: 5px; }
    .tab-btn { flex: 1; padding: 8px; background: var(--obs-card); border: 1px solid var(--obs-border-light); color: var(--obs-text); cursor: pointer; border-radius: 4px; font-weight: bold; }
    .tab-btn.active { background: var(--obs-btn-hover); color: white; border-color: var(--obs-primary); }
    
    .song-item-wrapper { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--obs-border-light); transition: background-color 0.2s; }
    .song-item-wrapper:last-child { border-bottom: none; }
    .song-title-click { flex: 1; padding: 12px; cursor: pointer; }
    .song-title-click:hover { background-color: var(--obs-btn-bg); color: var(--obs-text-light); }
    
    .action-btn { background: transparent; border: none; color: var(--obs-text); cursor: pointer; padding: 10px; font-size: 16px; transition: color 0.2s; }
    .action-btn:hover { color: var(--obs-primary); }
    .action-btn.remove:hover { color: var(--obs-danger); }
    
    .paste-area { width: 100%; height: 80px; background: var(--obs-input-bg); color: var(--obs-text-light); border: 1px solid var(--obs-border-light); border-radius: 4px; padding: 8px; box-sizing: border-box; margin-bottom: 10px; resize: vertical; font-family: monospace; }
    .search-row { display: flex; gap: 5px; margin-bottom: 15px; }
    .settings-panel { background-color: var(--obs-card); border: 1px solid var(--obs-border); border-radius: 4px; padding: 15px; margin-top: 15px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

    /* Presenter View Styles */
    .presenter-slide { padding: 12px; cursor: pointer; border-bottom: 1px solid var(--obs-border-light); transition: all 0.2s; }
    .presenter-slide:hover { background-color: var(--obs-btn-bg); }
    .presenter-slide.active-slide { background-color: var(--obs-primary); color: white; border-left: 4px solid #fff; }
    .slide-label { font-size: 12px; font-weight: bold; color: var(--obs-text); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .active-slide .slide-label { color: rgba(255, 255, 255, 0.8); }
    .slide-preview { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--obs-text-light); }

    /* Output Display Styles */
    .output-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 5vh; background-color: transparent; }
    .lyric-box { background-color: rgba(0, 0, 0, 0.7); color: white; text-align: center; padding: 20px 40px; border-radius: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-weight: 700; width: 90%; max-width: 1200px; transition: opacity 0.25s ease-in-out; }
    .fade-in { opacity: 1; }
    .fade-out { opacity: 0; }

    .danger-zone { margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--obs-danger); }
    .error-msg { color: var(--obs-danger); background: rgba(228, 46, 46, 0.1); padding: 10px; border-radius: 4px; margin-bottom: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const STORAGE_KEY = 'obs_hymnal_db';
    const ACTIVE_SONG_KEY = 'obs_active_song';
    const channel = new BroadcastChannel('hymnal_sync_channel');

    // ── Output Display (For OBS Browser Source overlay) ──────────────────────
    function OutputDisplay() {
      const [lyrics, setLyrics] = useState([]);
      const [fontSize, setFontSize] = useState(48);
      const [fadeClass, setFadeClass] = useState('fade-in');

      useEffect(() => {
        const loadState = () => {
          try {
            const data = localStorage.getItem(ACTIVE_SONG_KEY);
            if (data) applyNewState(JSON.parse(data));
          } catch(e) { console.error("Error reading output state", e); }
        };

        const applyNewState = (data) => {
           setFadeClass('fade-out');
           setTimeout(() => {
              setLyrics(data.lyrics || []);
              if (data.fontSize) setFontSize(data.fontSize);
              setFadeClass('fade-in');
           }, 250); // Crossfade timing
        };

        loadState();

        channel.onmessage = (event) => {
          if (event.data.type === 'UPDATE_OUTPUT') {
             applyNewState(event.data);
          } else if (event.data.type === 'CLEAR_OUTPUT') {
             setFadeClass('fade-out');
             setTimeout(() => setLyrics([]), 250);
          }
        };

        window.addEventListener('storage', loadState);
        return () => {
          channel.onmessage = null;
          window.removeEventListener('storage', loadState);
        };
      }, []);

      if (!lyrics || lyrics.length === 0) {
        return (
          <div className="output-container" style={{ justifyContent: 'center', alignItems: 'center' }}>
             <div style={{ color: 'rgba(255, 255, 255, 0.2)', fontStyle: 'italic', fontSize: '24px' }}>
                Waiting for hymnal output...
             </div>
          </div>
        );
      }

      return (
        <div className="output-container">
          <div className={`lyric-box ${fadeClass}`} style={{ fontSize: `${fontSize}px`, lineHeight: 1.4 }}>
            {lyrics.map((line, i) => (
              <div key={i}>{line}</div>
            ))}
          </div>
        </div>
      );
    }

    // ── Control Dock (For OBS Dock Panel) ────────────────────────────────────
    function ControlDock() {
      const [activeDb, setActiveDb] = useState({});
      const [searchTerm, setSearchTerm] = useState('');
      const [searchMode, setSearchMode] = useState('text'); 
      const [showSettings, setShowSettings] = useState(false);
      const [activeTab, setActiveTab] = useState('library'); 
      const [schedule, setSchedule] = useState([]);
      const [jsonPaste, setJsonPaste] = useState('');
      
      const [fontSize, setFontSize] = useState(48);
      const [rowsVisible, setRowsVisible] = useState(4);
      const [dbError, setDbError] = useState(null);
      const fileInputRef = useRef(null);

      // Presenter State
      const [liveSong, setLiveSong] = useState(null);
      const [liveSlide, setLiveSlide] = useState(0);

      useEffect(() => {
        loadDatabase();
        const savedSchedule = localStorage.getItem('obs_hymnal_schedule');
        if (savedSchedule) { try { setSchedule(JSON.parse(savedSchedule)); } catch(e) {} }
      }, []);

      useEffect(() => { localStorage.setItem('obs_hymnal_schedule', JSON.stringify(schedule)); }, [schedule]);

      const processAndSaveData = (parsed) => {
        let validDb = {};
        let badEntriesFound = 0;
        if (typeof parsed !== 'object' || parsed === null) throw new Error("Invalid structured data.");
        
        Object.keys(parsed).forEach(key => {
          const item = parsed[key];
          
          // 1. Is it already formatted into Stanzas? (e.g. reloading previous session)
          if (Array.isArray(item) && item.length > 0 && item[0].label && item[0].lines) {
            validDb[key] = item;
          } 
          // 2. Legacy Flat Array -> Map to a single Stanza block
          else if (Array.isArray(item)) { 
            validDb[key] = [{ label: 'Lyrics', lines: item }];
          } 
          // 3. New Nested Object Format -> Map out Verses and Choruses
          else if (item && typeof item === 'object' && item.title) {
            const newTitle = isNaN(key) ? item.title : `${key} - ${item.title}`;
            let stanzas = [];
            let chorusLines = item.chorus && typeof item.chorus === 'string' ? item.chorus.split('\n') : null;
            
            if (Array.isArray(item.verses)) {
              item.verses.forEach((verse, idx) => {
                if (typeof verse === 'string') stanzas.push({ label: `Verse ${idx + 1}`, lines: verse.split('\n') });
                if (chorusLines) stanzas.push({ label: 'Chorus', lines: chorusLines });
              });
            } else if (chorusLines) {
              stanzas.push({ label: 'Chorus', lines: chorusLines });
            }
            validDb[newTitle] = stanzas;
          } 
          else { badEntriesFound++; }
        });

        if (badEntriesFound > 0) setDbError(`Ignored ${badEntriesFound} corrupted song(s).`);
        setActiveDb(validDb);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(validDb));
      };

      const loadDatabase = () => {
        setDbError(null);
        try {
          const rawData = localStorage.getItem(STORAGE_KEY);
          if (rawData) processAndSaveData(JSON.parse(rawData));
        } catch(e) { setDbError("Critical Error loading database."); }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            setDbError(null);
            processAndSaveData(JSON.parse(event.target.result));
            alert('Hymnal database uploaded safely!');
          } catch(error) { alert('Upload failed: Invalid file format.'); }
        };
        reader.readAsText(file);
      };

      const handlePasteJSON = () => {
        try {
          setDbError(null);
          processAndSaveData(JSON.parse(jsonPaste));
          setJsonPaste('');
          alert('Database updated from pasted JSON!');
        } catch(e) { alert('Failed to load. Please ensure your pasted text is valid JSON.'); }
      };

      const handleDownloadBackup = () => {
        const data = localStorage.getItem(STORAGE_KEY) || '{}';
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'hymnal_backup.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      // ── PRESENTER LOGIC ──────────────────────────────────────────────────
      // Dynamically chunks the verses/choruses based on "Lines per Slide" setting
      const presentationSlides = useMemo(() => {
         if (!liveSong || !activeDb[liveSong]) return [];
         let slides = [];
         activeDb[liveSong].forEach(stanza => {
            for (let i = 0; i < stanza.lines.length; i += rowsVisible) {
               slides.push({
                  label: stanza.label + (stanza.lines.length > rowsVisible ? ` (Part ${Math.floor(i/rowsVisible)+1})` : ''),
                  lines: stanza.lines.slice(i, i + rowsVisible)
               });
            }
         });
         return slides;
      }, [liveSong, activeDb, rowsVisible]);

      // Ensures we don't go out of bounds if rowsVisible changes while live
      useEffect(() => {
        if (liveSong && presentationSlides.length > 0) {
           if (liveSlide >= presentationSlides.length) setLiveSlide(presentationSlides.length - 1);
        }
      }, [presentationSlides, liveSong, liveSlide]);

      // Sync to output whenever slide changes
      useEffect(() => {
        if (liveSong && presentationSlides[liveSlide]) {
          const slide = presentationSlides[liveSlide];
          const payload = { lyrics: slide.lines, fontSize };
          localStorage.setItem(ACTIVE_SONG_KEY, JSON.stringify(payload));
          channel.postMessage({ type: 'UPDATE_OUTPUT', ...payload });
        }
      }, [liveSong, liveSlide, presentationSlides, fontSize]);

      // Arrow Key Navigation Support
      useEffect(() => {
         const handleKeyDown = (e) => {
            if (!liveSong) return;
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
               e.preventDefault();
               setLiveSlide(s => Math.min(s + 1, presentationSlides.length - 1));
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
               e.preventDefault();
               setLiveSlide(s => Math.max(s - 1, 0));
            }
         };
         window.addEventListener('keydown', handleKeyDown);
         return () => window.removeEventListener('keydown', handleKeyDown);
      }, [liveSong, presentationSlides]);

      const startPresentation = (title) => {
        setLiveSong(title);
        setLiveSlide(0);
        setShowSettings(false);
      };

      const clearOutput = () => {
        localStorage.removeItem(ACTIVE_SONG_KEY);
        channel.postMessage({ type: 'CLEAR_OUTPUT' });
      };

      const handleHardReset = () => {
        const userInput = prompt('DANGER: This will delete your entire hymnal database.\n\nType DELETE below:');
        if (userInput === 'DELETE') {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(ACTIVE_SONG_KEY);
          setSchedule([]);
          setActiveDb({});
          setSearchTerm('');
          setLiveSong(null);
          setDbError(null);
          channel.postMessage({ type: 'CLEAR_OUTPUT' });
          alert('Database wiped.');
        }
      };

      const filteredSongs = Object.keys(activeDb).filter(title => {
        try {
          if (!title) return false;
          if (!searchTerm) return true;
          if (searchMode === 'number') return title.startsWith(searchTerm);
          return title.toLowerCase().includes(searchTerm.toLowerCase());
        } catch(e) { return false; }
      });

      return (
        <div className="controller-container">
          <div className="header-bar">
            <h3 style={{ margin: 0 }}>Hymnal Control</h3>
            <button className="btn btn-danger" onClick={clearOutput}>Clear Live</button>
          </div>

          {dbError && <div className="error-msg">⚠️ {dbError}</div>}

          {/* DYNAMIC VIEW SWAP: Show Presenter View OR Library/Schedule */}
          {liveSong ? (
            <div style={{ display: 'flex', flexDirection: 'column', flex: 1, overflow: 'hidden' }}>
              <div style={{ display: 'flex', alignItems: 'center', marginBottom: 10 }}>
                 <button className="btn" onClick={() => setLiveSong(null)}>⬅ Library</button>
                 <h4 style={{ margin: '0 0 0 10px', flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', color: 'var(--obs-primary)' }}>
                   {liveSong}
                 </h4>
              </div>
              
              <div style={{ display: 'flex', gap: 10, marginBottom: 10 }}>
                 <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => setLiveSlide(s => Math.max(s - 1, 0))} disabled={liveSlide === 0}>◀ Prev</button>
                 <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => setLiveSlide(s => Math.min(s + 1, presentationSlides.length - 1))} disabled={liveSlide === presentationSlides.length - 1}>Next ▶</button>
              </div>
              
              <div style={{ fontSize: 11, textAlign: 'center', marginBottom: 5, color: 'var(--obs-border-light)' }}>
                 Tip: Use Left/Right Arrow Keys to navigate
              </div>

              <div className="song-list">
                 {presentationSlides.map((slide, idx) => (
                   <div 
                     key={idx} 
                     className={`presenter-slide ${liveSlide === idx ? 'active-slide' : ''}`}
                     onClick={() => setLiveSlide(idx)}
                   >
                     <div className="slide-label">{slide.label}</div>
                     <div className="slide-preview">{slide.lines.join(' / ')}</div>
                   </div>
                 ))}
              </div>
            </div>
          ) : (
            <React.Fragment>
              <div className="tab-bar">
                <button className={`tab-btn ${activeTab === 'library' ? 'active' : ''}`} onClick={() => setActiveTab('library')}>Library</button>
                <button className={`tab-btn ${activeTab === 'schedule' ? 'active' : ''}`} onClick={() => setActiveTab('schedule')}>Schedule ({schedule.length})</button>
              </div>

              {activeTab === 'library' && (
                <React.Fragment>
                  <div className="search-row">
                    <input 
                      type="text" 
                      className="search-input" 
                      style={{ marginBottom: 0 }}
                      placeholder={`Search by ${searchMode}...`} 
                      value={searchTerm}
                      onChange={e => setSearchTerm(e.target.value)}
                    />
                    <button className="btn" onClick={() => setSearchMode(searchMode === 'text' ? 'number' : 'text')} title="Toggle Search Mode">
                      {searchMode === 'text' ? 'Aa' : '123'}
                    </button>
                  </div>
                  <div className="song-list">
                    {Object.keys(activeDb).length === 0 ? (
                       <div style={{ padding: 20, textAlign: 'center', color: 'var(--obs-border-light)' }}>
                         No songs found. Expand Settings ▼ to upload.
                       </div>
                    ) : (
                      filteredSongs.map((title) => (
                        <div key={title} className="song-item-wrapper">
                          <div className="song-title-click" onClick={() => startPresentation(title)}>
                            {title}
                          </div>
                          <button className="action-btn" onClick={() => !schedule.includes(title) && setSchedule([...schedule, title])} title="Add to Schedule">➕</button>
                        </div>
                      ))
                    )}
                  </div>
                </React.Fragment>
              )}

              {activeTab === 'schedule' && (
                <div className="song-list">
                  {schedule.length === 0 ? (
                     <div style={{ padding: 20, textAlign: 'center', color: 'var(--obs-border-light)' }}>
                       Schedule is empty. Add songs from the Library.
                     </div>
                  ) : (
                    schedule.map((title) => (
                      <div key={title} className="song-item-wrapper">
                        <div className="song-title-click" onClick={() => startPresentation(title)}>
                          {title}
                        </div>
                        <button className="action-btn remove" onClick={() => setSchedule(schedule.filter(t => t !== title))} title="Remove">✖</button>
                      </div>
                    ))
                  )}
                </div>
              )}
            </React.Fragment>
          )}

          {/* Original Accordion Settings Layout */}
          <div className="settings-panel">
             <div className="setting-row" onClick={() => setShowSettings(!showSettings)} style={{ cursor: 'pointer', marginBottom: 0 }}>
                <h4 style={{ margin: 0 }}>Settings & Database</h4>
                <span style={{ color: "var(--obs-text)" }}>{showSettings ? '▲' : '▼'}</span>
             </div>
             
             {showSettings && (
               <div style={{ marginTop: 15, maxHeight: '40vh', overflowY: 'auto', paddingRight: '5px' }}>
                 <div className="setting-row">
                    <span>Font Size ({fontSize}px)</span>
                    <input type="range" min="16" max="120" value={fontSize} onChange={e => setFontSize(Number(e.target.value))} />
                 </div>
                 <div className="setting-row">
                    <span>Lines per Slide ({rowsVisible})</span>
                    <input type="range" min="1" max="8" value={rowsVisible} onChange={e => setRowsVisible(Number(e.target.value))} />
                 </div>
                 
                 <h4 style={{ margin: '20px 0 10px 0', borderTop: '1px solid var(--obs-border-light)', paddingTop: 15 }}>Manage Database</h4>
                 
                 <button className="btn" style={{ width: '100%', marginBottom: 10, backgroundColor: 'var(--obs-btn-bg)' }} onClick={handleDownloadBackup}>
                   💾 Download Backup
                 </button>

                 <input 
                   type="file" 
                   accept=".json" 
                   ref={fileInputRef} 
                   style={{ display: 'none' }} 
                   onChange={handleFileUpload} 
                 />
                 <button className="btn btn-primary" style={{ width: '100%', marginBottom: 10 }} onClick={() => fileInputRef.current.click()}>
                   📁 Upload JSON File
                 </button>

                 <div style={{ marginTop: 10 }}>
                   <p style={{ fontSize: 12, margin: '0 0 5px 0', color: 'var(--obs-text)' }}>Or Paste JSON Data:</p>
                   <textarea 
                     className="paste-area" 
                     value={jsonPaste} 
                     onChange={e => setJsonPaste(e.target.value)}
                     placeholder='{"1 - Song": ["Lyric 1", "Lyric 2"]}'
                   />
                   <button className="btn" style={{ width: '100%' }} onClick={handlePasteJSON}>
                     Load Pasted Data
                   </button>
                 </div>

                 <div className="danger-zone">
                    <button className="btn btn-danger" style={{ width: '100%' }} onClick={handleHardReset}>
                      ⚠️ Wipe & Reset Database
                    </button>
                 </div>
               </div>
             )}
          </div>
        </div>
      );
    }

    function App() {
      const [isOutputMode, setIsOutputMode] = useState(window.innerWidth > 800);
      useEffect(() => {
        const handleResize = () => setIsOutputMode(window.innerWidth > 800);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);
      return isOutputMode ? <OutputDisplay /> : <ControlDock />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
