<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Hymnal Controller</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* OBS Yami Theme Colors */
      --obs-bg: #1c1f24;
      --obs-card: #2b2e38;
      --obs-border: #121418;
      --obs-border-light: #424755;
      --obs-primary: #2e85e4;
      --obs-primary-hover: #1e75d4;
      --obs-danger: #e42e2e;
      --obs-danger-hover: #c42222;
      --obs-btn-bg: #3e4451;
      --obs-btn-hover: #4d5565;
      --obs-text: #cccccc;
      --obs-text-light: #ffffff;
      --obs-input-bg: #121418;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Lato', sans-serif;
      background-color: var(--obs-bg);
      color: var(--obs-text);
      overflow-x: hidden;
    }

    /* Scrollbar Styling for OBS */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--obs-bg); }
    ::-webkit-scrollbar-thumb { background: var(--obs-btn-bg); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--obs-border-light); }

    .controller-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 15px;
      box-sizing: border-box;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--obs-border-light);
    }

    .search-input {
      width: 100%;
      padding: 10px;
      background-color: var(--obs-input-bg);
      border: 1px solid var(--obs-border-light);
      color: var(--obs-text-light);
      border-radius: 4px;
      font-size: 16px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--obs-primary);
    }

    .song-list {
      flex: 1;
      overflow-y: auto;
      background-color: var(--obs-card);
      border-radius: 4px;
      border: 1px solid var(--obs-border);
      padding: 5px;
    }

    .song-item {
      padding: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--obs-border-light);
      transition: background-color 0.2s;
    }

    .song-item:hover { background-color: var(--obs-btn-bg); color: var(--obs-text-light); }
    .song-item:last-child { border-bottom: none; }

    .settings-panel {
      background-color: var(--obs-card);
      border: 1px solid var(--obs-border);
      border-radius: 4px;
      padding: 15px;
      margin-top: 15px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .btn {
      background-color: var(--obs-btn-bg);
      color: var(--obs-text-light);
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn:hover { background-color: var(--obs-btn-hover); }
    .btn-primary { background-color: var(--obs-primary); }
    .btn-primary:hover { background-color: var(--obs-primary-hover); }
    .btn-danger { background-color: var(--obs-danger); }
    .btn-danger:hover { background-color: var(--obs-danger-hover); }

    /* Output Display Styles */
    .output-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 5vh;
      /* Default transparent background for OBS overlay */
      background-color: transparent; 
    }

    .lyric-box {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      padding: 20px 40px;
      border-radius: 8px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      font-weight: 700;
      width: 90%;
      max-width: 1200px;
    }

    .danger-zone {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed var(--obs-danger);
    }
    
    .error-msg {
      color: var(--obs-danger);
      background: rgba(228, 46, 46, 0.1);
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const STORAGE_KEY = 'obs_hymnal_db';
    const ACTIVE_SONG_KEY = 'obs_active_song';
    const channel = new BroadcastChannel('hymnal_sync_channel');

    // ── Output Display (For OBS Browser Source overlay) ──────────────────────
    function OutputDisplay() {
      const [lyrics, setLyrics] = useState([]);
      const [fontSize, setFontSize] = useState(48);
      const [rowsVisible, setRowsVisible] = useState(4);

      useEffect(() => {
        // Load initial state
        const loadState = () => {
          try {
            const data = localStorage.getItem(ACTIVE_SONG_KEY);
            if (data) {
              const parsed = JSON.parse(data);
              if (parsed && Array.isArray(parsed.lyrics)) {
                setLyrics(parsed.lyrics);
                setFontSize(parsed.fontSize || 48);
                setRowsVisible(parsed.rows || 4);
              }
            }
          } catch(e) { console.error("Error reading output state", e); }
        };

        loadState();

        // Listen for real-time updates via BroadcastChannel
        channel.onmessage = (event) => {
          if (event.data.type === 'UPDATE_OUTPUT') {
             setLyrics(event.data.lyrics || []);
             setFontSize(event.data.fontSize || 48);
             setRowsVisible(event.data.rows || 4);
          } else if (event.data.type === 'CLEAR_OUTPUT') {
             setLyrics([]);
          }
        };

        // Fallback sync for edge cases
        window.addEventListener('storage', loadState);
        return () => {
          channel.onmessage = null;
          window.removeEventListener('storage', loadState);
        };
      }, []);

      if (!lyrics || lyrics.length === 0) return null;

      // Slice the lyrics based on user setting
      const displayedLyrics = lyrics.slice(0, rowsVisible);

      return (
        <div className="output-container">
          <div className="lyric-box" style={{ fontSize: `${fontSize}px`, lineHeight: 1.4 }}>
            {displayedLyrics.map((line, i) => (
              <div key={i}>{line}</div>
            ))}
          </div>
        </div>
      );
    }

    // ── Control Dock (For OBS Dock Panel) ────────────────────────────────────
    function ControlDock() {
      const [activeDb, setActiveDb] = useState({});
      const [searchTerm, setSearchTerm] = useState('');
      const [showSettings, setShowSettings] = useState(false);
      const [fontSize, setFontSize] = useState(48);
      const [rowsVisible, setRowsVisible] = useState(4);
      const [dbError, setDbError] = useState(null);
      const fileInputRef = useRef(null);

      // Load DB on mount
      useEffect(() => {
        loadDatabase();
      }, []);

      const loadDatabase = () => {
        setDbError(null);
        try {
          const rawData = localStorage.getItem(STORAGE_KEY);
          if (rawData) {
            const parsed = JSON.parse(rawData);
            
            // IDEA 1 FIX: Strict Data Validation
            // We ensure we only load valid arrays, ignoring malformed data that causes the "white screen"
            let validDb = {};
            let badEntriesFound = 0;

            if (typeof parsed !== 'object' || parsed === null) {
                throw new Error("The uploaded file does not contain valid structured data.");
            }

            Object.keys(parsed).forEach(key => {
              if (Array.isArray(parsed[key])) {
                  // Valid format, keep it
                  validDb[key] = parsed[key];
              } else {
                  // Malformed data! quarantine it instead of crashing.
                  badEntriesFound++;
              }
            });

            if (badEntriesFound > 0) {
                setDbError(`Ignored ${badEntriesFound} corrupted song(s) to prevent crashing.`);
            }

            setActiveDb(validDb);
          }
        } catch(e) {
          console.error("Database load error:", e);
          setDbError("Critical Error loading database. Please perform a Database Reset in Settings.");
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const result = JSON.parse(event.target.result);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(result));
            loadDatabase(); // Reloads and validates
            alert('Hymnal database updated successfully!');
          } catch(error) {
            alert('Upload failed: Invalid file format. Please ensure it is a valid JSON file.');
          }
        };
        reader.readAsText(file);
      };

      const sendToOutput = (title, lyrics) => {
        const payload = { lyrics, fontSize, rows: rowsVisible };
        localStorage.setItem(ACTIVE_SONG_KEY, JSON.stringify(payload));
        channel.postMessage({ type: 'UPDATE_OUTPUT', ...payload });
      };

      const clearOutput = () => {
        localStorage.removeItem(ACTIVE_SONG_KEY);
        channel.postMessage({ type: 'CLEAR_OUTPUT' });
      };

      // IDEAS 2 & 3 FIX: Nuclear Reset Function
      const handleHardReset = () => {
        const userInput = prompt('DANGER: This will delete your entire hymnal database.\n\nTo proceed, type the word DELETE below:');
        
        if (userInput === 'DELETE') {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(ACTIVE_SONG_KEY);
          setActiveDb({});
          setSearchTerm('');
          setDbError(null);
          channel.postMessage({ type: 'CLEAR_OUTPUT' });
          alert('Database has been completely wiped. You may now upload a fresh file.');
        } else if (userInput !== null) {
          alert('Reset canceled. You did not type DELETE.');
        }
      };

      // IDEA 1 FIX: Safe Search
      // Wrap the filter logic in try/catch so if a weird string sneaks in, it won't crash React
      const filteredSongs = Object.keys(activeDb).filter(title => {
        try {
          if (!title) return false;
          return title.toLowerCase().includes(searchTerm.toLowerCase());
        } catch(e) {
          return false; // Safely skip broken titles
        }
      });

      return (
        <div className="controller-container">
          <div className="header-bar">
            <h3 style={{ margin: 0 }}>Hymnal Control</h3>
            <div>
              <button className="btn btn-danger" onClick={clearOutput} style={{ marginRight: '10px' }}>Clear Live</button>
              <button className="btn" onClick={() => setShowSettings(!showSettings)}>⚙️</button>
            </div>
          </div>

          {dbError && (
             <div className="error-msg">
                ⚠️ {dbError}
             </div>
          )}

          {!showSettings ? (
            <>
              <input 
                type="text" 
                className="search-input" 
                placeholder="Search hymnal..." 
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}
              />
              <div className="song-list">
                {Object.keys(activeDb).length === 0 ? (
                   <div style={{ padding: 20, textAlign: 'center', color: 'var(--obs-border-light)' }}>
                     No songs found. Open settings ⚙️ to upload database.
                   </div>
                ) : (
                  filteredSongs.map((title) => (
                    <div key={title} className="song-item" onClick={() => sendToOutput(title, activeDb[title])}>
                      {title}
                    </div>
                  ))
                )}
              </div>
            </>
          ) : (
            <div className="settings-panel">
               <h4 style={{ margin: '0 0 15px 0' }}>Display Settings</h4>
               <div className="setting-row">
                  <span>Font Size ({fontSize}px)</span>
                  <input type="range" min="16" max="120" value={fontSize} onChange={e => setFontSize(Number(e.target.value))} />
               </div>
               <div className="setting-row">
                  <span>Lines per Slide ({rowsVisible})</span>
                  <input type="range" min="1" max="8" value={rowsVisible} onChange={e => setRowsVisible(Number(e.target.value))} />
               </div>
               
               <h4 style={{ margin: '25px 0 15px 0', borderTop: '1px solid var(--obs-border-light)', paddingTop: 15 }}>Database</h4>
               <input 
                 type="file" 
                 accept=".json" 
                 ref={fileInputRef} 
                 style={{ display: 'none' }} 
                 onChange={handleFileUpload} 
               />
               <button className="btn btn-primary" style={{ width: '100%', marginBottom: 10 }} onClick={() => fileInputRef.current.click()}>
                 Upload Hymnal File (.json)
               </button>

               {/* Ideas 2 & 3: The Danger Zone */}
               <div className="danger-zone">
                  <p style={{ fontSize: 12, color: 'var(--obs-text)', marginTop: 0 }}>Troubleshooting / Reset</p>
                  <button className="btn btn-danger" style={{ width: '100%' }} onClick={handleHardReset}>
                    ⚠️ Wipe & Reset Database
                  </button>
               </div>
            </div>
          )}
        </div>
      );
    }

    // ── App Initialization (Auto-Detect Width) ───────────────────────────────
    function App() {
      // Wide window (Stream Source) = Output, Narrow window (Dock) = Controller
      const [isOutputMode, setIsOutputMode] = useState(window.innerWidth > 800);
      
      useEffect(() => {
        const handleResize = () => setIsOutputMode(window.innerWidth > 800);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);
      
      return isOutputMode ? <OutputDisplay /> : <ControlDock />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
